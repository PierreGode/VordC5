name: Build Vord C5 and deploy flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # delete stale github-pages artifacts from prior run attempts

# Allow only one Pages deployment at a time, but never cancel an in-progress
# run. Cancelling mid-run can leave its uploaded "github-pages" artifact behind,
# which makes the next run's deploy-pages fail with "Multiple artifacts named
# github-pages were unexpectedly found." Letting runs finish avoids that.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.arduino15
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build firmware (ESP32-C5 Dev)
        run: pio run -e esp32c5-dev

      - name: Build firmware (LilyGO T-Dongle-C5)
        run: pio run -e tdongle-c5

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            "https://espressif.github.io/arduino-esp32/package_esp32_dev_index.json"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Build firmware (Seeed XIAO ESP32-C5)
        run: bash scripts/build-xiao.sh

      - name: Build firmware (ESP32-WROOM-32 classic-BT scout)
        run: bash scripts/build-wroom32.sh

      - name: Stage site
        run: |
          mkdir -p site/firmware
          cp -r docs/. site/

          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found"; exit 1
          fi

          C5_DIR=.pio/build/esp32c5-dev
          python -m esptool --chip esp32c5 merge_bin \
            --output site/firmware/vord-c5-dev.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            --target-offset 0x0 \
            0x2000   "$C5_DIR/bootloader.bin" \
            0x8000   "$C5_DIR/partitions.bin" \
            0xe000   "$BOOT_APP0" \
            0x10000  "$C5_DIR/firmware.bin"

          TDONGLE_DIR=.pio/build/tdongle-c5
          python -m esptool --chip esp32c5 merge_bin \
            --output site/firmware/vord-c5-tdongle.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            --target-offset 0x0 \
            0x2000   "$TDONGLE_DIR/bootloader.bin" \
            0x8000   "$TDONGLE_DIR/partitions.bin" \
            0xe000   "$BOOT_APP0" \
            0x10000  "$TDONGLE_DIR/firmware.bin"

          XIAO_DIR=build-sketch/VordC5/build/esp32.esp32.XIAO_ESP32C5
          BOOT_APP0_ARD=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -n 1)
          if [ -z "$BOOT_APP0_ARD" ]; then
            echo "arduino15 boot_app0.bin not found"; exit 1
          fi
          python -m esptool --chip esp32c5 merge_bin \
            --output site/firmware/vord-c5-xiao.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            --target-offset 0x0 \
            0x2000   "$XIAO_DIR/VordC5.ino.bootloader.bin" \
            0x8000   "$XIAO_DIR/VordC5.ino.partitions.bin" \
            0xe000   "$BOOT_APP0_ARD" \
            0x10000  "$XIAO_DIR/VordC5.ino.bin"

          # Classic ESP32-WROOM-32 scout (arduino-cli build). NOTE the classic
          # ESP32 bootloader lives at 0x1000 (not 0x2000 like the C5 chips), and
          # the WROOM-32 is a 4 MB / 40 MHz-flash part.
          WROOM_DIR=wroom32-classic-bt/build/esp32.esp32.esp32
          python -m esptool --chip esp32 merge_bin \
            --output site/firmware/vord-wroom32.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            --target-offset 0x0 \
            0x1000   "$WROOM_DIR/wroom32-classic-bt.ino.bootloader.bin" \
            0x8000   "$WROOM_DIR/wroom32-classic-bt.ino.partitions.bin" \
            0xe000   "$BOOT_APP0_ARD" \
            0x10000  "$WROOM_DIR/wroom32-classic-bt.ino.bin"

          VERSION="$(date -u +%-m.%-d).${GITHUB_SHA::7}"
          echo "Version: $VERSION"

          for m in manifest-esp32c5.json manifest-xiao-esp32c5.json manifest-tdongle-c5.json manifest-wroom32.json manifest.json; do
            jq --arg v "$VERSION" '.version = $v' "site/$m" > "site/$m.tmp"
            mv "site/$m.tmp" "site/$m"
          done

          echo "{\"build\":\"$VERSION\",\"sha\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > site/version.json

      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If Pages is set to "Deploy from a branch", GitHub keeps publishing the
          # README via Jekyll and ignores this workflow's artifact. Force the
          # source to the "workflow" build type so our flasher site is what ships.
          # Non-fatal: if org/token policy blocks the change, set it manually in
          # Settings > Pages > Source = "GitHub Actions".
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
              && echo "Pages source set to GitHub Actions" \
              || echo "WARN: could not update Pages source — set it manually in Settings > Pages"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
              && echo "Pages enabled with GitHub Actions source" \
              || echo "WARN: could not enable Pages — enable it in Settings > Pages (Source: GitHub Actions)"
          fi

      - uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages via the API if it isn't already, instead of
          # failing with "Get Pages site failed" on first run.
          enablement: true

      - name: Remove stale github-pages artifacts from prior attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a re-run, the previous attempt's "github-pages" artifact lingers
          # and makes deploy-pages fail with "Multiple artifacts named
          # github-pages were unexpectedly found." Delete any that already exist
          # for this run before uploading a fresh one. Non-fatal.
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                  --jq '.artifacts[] | select(.name=="github-pages") | .id' 2>/dev/null || true)
          for id in $ids; do
            echo "Deleting stale artifact $id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
