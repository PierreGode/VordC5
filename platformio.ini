; PlatformIO Project Configuration
; Vord C5 — continuous BLE skimmer detector
;
; Supported in this PlatformIO project:
;   esp32c5-dev  -> ESP32-C5 Dev Board / Waveshare ESP32-C5-WIFI6-KIT (16 MB)
;   tdongle-c5   -> LilyGO T-Dongle-C5 (16 MB, ST7735 0.96" screen alert)
;
; Seeed XIAO ESP32-C5 is supported via scripts/build-xiao.sh (arduino-cli).

[platformio]
default_envs = esp32c5-dev
; Custom board definition for the LilyGO T-Dongle-C5 lives in boards/.
boards_dir = boards

[env]
framework     = arduino
monitor_speed = 460800
upload_speed  = 921600
; Bake the build id (UTC date + git short SHA) into VORD_BUILD so the AP web
; dashboard shows the same "build number" as the flasher. See scripts/version.py.
extra_scripts = pre:scripts/version.py

[env:esp32c5-dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board    = esp32-c5-devkitc1-n16r4

board_build.f_cpu      = 240000000L
board_build.partitions = default_16MB.csv

build_src_filter =
    +<main.cpp>
    +<battery.cpp>
    +<ble_scanner.cpp>
    +<runtime_config.cpp>
    +<scan_cycle.cpp>
    +<skimmer_led.cpp>
    +<web_portal.cpp>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DVORD_BOARD_C5=1
    -DVORD_BOARD_XIAO_C5=0
    -DVORD_HAS_DISPLAY=0
    -DVORD_HAS_GPS=0
    -DVORD_HAS_SKIMMER_LED=1
    -DVORD_HAS_MODE_BUTTON=0
    ; The dev board's onboard WS2812B (RGB_BUILTIN) is used by default. To drive
    ; your own WS2812B/SK6812 pixel instead, wire DIN->a free GPIO, VCC->3V3,
    ; GND->GND and uncomment the next line with that GPIO number:
    ; -DSKIMMER_LED_PIN=2

; --- LilyGO T-Dongle-C5 (ESP32-C5HR8, 16 MB, ST7735 80x160 0.96" display) ---
; Same C5 chip and platform as the dev board. Two local alerts run together: the
; on-board screen flashes RED with a distance-dependent rate, and the on-board
; RGB LED gives the usual proximity feedback. That LED is an APA102 (2-wire
; clock+data on GPIO4/5), not a WS2812B, so skimmer_led uses its APA102 backend
; here (SKIMMER_LED_APA102=1). The battery ADC is disabled because its pin
; (GPIO6) is the LCD SCK on this board.
[env:tdongle-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board    = Lilygo-T-Dongle-C5

board_build.f_cpu      = 240000000L
board_build.partitions = default_16MB.csv

build_src_filter =
    +<main.cpp>
    +<battery.cpp>
    +<ble_scanner.cpp>
    +<runtime_config.cpp>
    +<scan_cycle.cpp>
    +<skimmer_led.cpp>
    +<skimmer_display.cpp>
    +<st7735.cpp>
    +<web_portal.cpp>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DVORD_BOARD_C5=1
    -DVORD_BOARD_XIAO_C5=0
    -DVORD_BOARD_TDONGLE_C5=1
    -DVORD_HAS_DISPLAY=1
    -DVORD_HAS_GPS=0
    -DVORD_HAS_SKIMMER_LED=1
    -DSKIMMER_LED_APA102=1       ; onboard LED is an APA102, not a WS2812B
    -DVORD_HAS_MODE_BUTTON=0
    -DVBAT_ADC_PIN=-1            ; GPIO6 is the LCD SCK on this board
